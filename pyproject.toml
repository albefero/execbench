[project]
name = "execbench"
version = "0.1.0"
description = "ExecBench: an Inspect benchmark of AI agents executing large orders under market constraints"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["inspect-ai>=0.3.100"]

[project.optional-dependencies]
dev = ["pytest"]

[project.entry-points.inspect_ai]
execbench = "execbench._registry"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["execbench"]
